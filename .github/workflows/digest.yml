name: digest

on:
  schedule:
    - cron: "30 14 * * *"         # 14:30 UTC = 8:00 PM IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jobradar-db
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUNBUFFERED: "1"          # show progress lines live in the Actions log
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m radar.main digest
      - name: Save state
        run: |
          git config user.name "job-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.db
          if ! git diff --cached --quiet; then
            git commit -q -m "digest: $(date -u +'%Y-%m-%d') [skip ci]"
            git pull -q --rebase && git push -q
          fi
