name: radar

on:
  schedule:
    - cron: "17 * * * *"          # hourly (public repo: Actions minutes are free); 17 past dodges the top-of-hour queue
  push:
    # GitHub drops scheduled runs when it's busy. The laptop relay's push of an inbox file
    # (every 2 h while the laptop is on) always starts a run, and its pages get ingested at once.
    # This workflow's own commits say [skip ci], so it never triggers itself.
    branches: [main]
    paths: ["data/inbox/**"]
  workflow_dispatch:
    inputs:
      only:
        description: "Limit sources, e.g. cg, district, academic (blank = all)"
        required: false
        default: ""

permissions:
  contents: write
  pages: write        # the dashboard app on GitHub Pages
  id-token: write

concurrency:
  group: jobradar-db              # radar and digest both commit the database; never overlap
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"          # show progress lines live in the Actions log
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"   # no pip cache: GitHub's cache restore stalls ("egress over the account limit")

      - name: Install OCR (Tesseract, Hindi + English)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-hin

      - run: pip install -r requirements.txt

      - name: Install headless browser (for JavaScript-built sites like SSC, NIELIT)
        run: python -m playwright install --with-deps chromium

      - name: Load state (database + dashboard from the state branch)
        run: bash tools/state.sh load

      - name: Run radar
        run: python -m radar.main run --runner cloud ${{ inputs.only && format('--only {0}', inputs.only) || '' }}

      - name: Save state
        run: |
          git config user.name "job-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash tools/state.sh save "radar: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git add -A data/   # relay inbox files this run consumed (the database itself is git-ignored)
          if ! git diff --cached --quiet; then
            git commit -q -m "radar: consumed relay inbox [skip ci]"
            git pull -q --rebase && git push -q
          fi

      - name: Publish dashboard (Cloudflare Pages)
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=job-radar --branch=main

      - name: Package the dashboard app for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publish:
    # https://saurabh-8816.github.io/job-radar/ — needs Settings → Pages → Source: "GitHub Actions"
    # once. Until then this job fails on its own; the radar run above is unaffected.
    needs: radar
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
