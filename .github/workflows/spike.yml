name: reachability-spike

# Phase 0: run once by hand. Shows which sources answer GitHub's (non-Indian) cloud IPs.
on:
  workflow_dispatch:

jobs:
  spike:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"   # no pip cache: GitHub's cache restore stalls ("egress over the account limit")
      - run: pip install -r requirements.txt
      - name: Probe every source
        run: python tools/spike_reachability.py >> "$GITHUB_STEP_SUMMARY"
