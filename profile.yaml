# Job Radar match profile — edit freely, no code changes needed.
#
# Term syntax
#   plain English  -> whole-word, case-insensitive          e.g.  programmer
#   cs:TERM        -> whole-word, CASE-SENSITIVE            e.g.  cs:IT   (so "it" doesn't match)
#   re:PATTERN     -> regular expression, case-insensitive  e.g.  re:\bM\.?\s?C\.?\s?A\b
#   Hindi text     -> plain substring match                 e.g.  प्रोग्रामर
#
# "head" = title + description from the listing. "body" = text of the advert PDF.
# Guiding rule: missing a job is worse than noise. Anything uncertain lands in tier B
# (daily digest). Nothing is ever deleted — tier C is still on the dashboard.

# Used on announcement pages and generic career pages to keep only job-related rows/links.
job_words:
  - recruit
  - re:\brecruitment\b
  - re:\bvacanc(y|ies)\b
  - advertisement
  - re:\badvt\.?\b
  - re:\bwalk[\s-]?in\b
  - re:\b(career|careers|jobs?|openings?|positions?)\b
  - re:\b(engagement|empanelment|deputation|contractual|outsourc\w*)\b
  - re:\bposts?\s+of\b
  - re:\bproject\s+(staff|associate|assistant|engineer|fellow|position|scientist|manager|officer|consultant|personnel)\b
  - re:\b(jrf|srf|ra-?i{1,3})\b
  - re:\bresearch\s+(associate|assistant|fellow|scientist)\b
  - re:\b(faculty|guest\s+lecturer|guest\s+faculty|teaching\s+assistant)\b
  - re:\binterview\b
  - re:\bapplications?\s+(are\s+)?invited\b
  - re:\b(online\s+form|apply\s+online|online\s+application)\b
  - re:\bselection\b
  - re:\bmerit\s+list\b
  - भर्ती
  - विज्ञापन
  - रिक्त
  - संविदा
  - नियुक्ति
  - पदों
  - पद हेतु
  - आवेदन
  - साक्षात्कार
  - चयन सूची
  - मेरिट सूची

# Notices that aren't jobs at all: school/college admissions, entrance tests for students,
# scholarships. Applied to the title/description, and only when no job word below is also
# there, so "Teacher for class 1-5 भर्ती" stays a job. Such notices are stored as tier C.
not_job_words:
  - re:\badmissions?\b
  - re:(?-i:\b(LEST|JNVST|NEET|JEE|CUET)\b)   # uppercase only: "Viksit Bharat-Jee Ram Ji" is a job scheme
  - re:\bcet\s+for\s+admission\b
  - re:\bclass\s+(vi|vii|viii|ix|x|xi|xii|[1-9]|1[0-2])(st|nd|rd|th)?\b
  - re:\bscholarships?\b
  - re:\bstudents?\s+(admission|registration|enrol+ment|counsel+ing)\b
  - re:\b(selection|entrance)\s+test\b
  # events and courses, not jobs: Faculty Development Programmes, workshops, webinars…
  - re:\bfaculty\s+development\s+program(me)?s?\b
  - re:(?-i:\bFDP\b)
  - re:\b(workshop|webinar|seminar|symposium|conference|hackathon|summer\s+school|winter\s+school)s?\b
  - re:\bshort[\s-]term\s+(course|training)\b
  - कक्षा
  - re:प्रवेश(?!\s*पत्र)            # admission, but not प्रवेश पत्र (admit card)
  - छात्रवृत्ति
job_core_words:
  - re:\brecruit\w*            # recruit, recruitment, recruiting
  - re:\bvacanc(y|ies)\b
  - re:\bposts?\s+of\b
  - re:\bwalk[\s-]?in\b
  - re:\b(engagement|contract(ual)?|appointment|faculty(?!\s+development)|teacher|lecturer|professor|programmer|engineer)\b
  - भर्ती
  - रिक्त
  - संविदा
  - शिक्षक
  - पदों
  - नियुक्ति

# Boilerplate removed from advert text before matching: it names a computing term without
# being about the job (e.g. every Aadhaar clause cites MeitY).
body_ignore:
  - re:\b(https?://|www\.)\S+          # web addresses ("iiserkol.ac.in/web/…" isn't a web-development post)
  - re:\b[\w.+-]+@[\w-]+\.[\w.-]+      # e-mail addresses
  - re:ministry\s+of\s+electronics\s*(&|and)\s*information\s+technology
  - re:electronics\s*(&|and)\s*information\s+technology
  - re:information\s+technology\s+act(,?\s*\d{4})?
  - re:\bIT\s+Act\b

# Notices about an existing drive (lists, results, schedules). They go to the digest
# as "update", never as an instant alert. Checked against head only.
update_words:
  - re:\bmerit\s*(-|cum)?\s*(list|selection)\b
  - re:\b(selection|waiting|provisional|final|select)\s*(-|cum)?\s*(list|lists)\b
  - re:\b(eligible|ineligible|in-eligible|shortlisted|short-listed|rejected)\b
  - re:\blist\s+of\s+(candidates|eligible|selected|shortlisted)\b
  - re:\bclaims?\s+(and|&)\s+objections?\b
  - re:\b(result|results|answer\s+key|cut[\s-]?off|admit\s+card|call\s+letter|hall\s+ticket)\b
  - re:\bskill\s+test\b
  - re:\b(interview|exam|examination|test)\s+(schedule|date|list)\b
  - re:\bdocument\s+verification\b
  - re:\b(corrigendum|addendum|erratum)\b
  - re:\b(dawa|dava)\b
  - re:\b(cancel\w*|suspension\s+of|suspended|postpone\w*|appointment\s+orders?)\b
  - re:\b(date\s+extension|extension\s+of\s+(the\s+)?(last\s+)?date|dates?\s+(is\s+|has\s+been\s+)?extended)\b
  - re:\bverification\s+of\s+(the\s+)?(original\s+)?(documents?|certificates?)\b
  - निरस्त
  - स्थगित
  - नियुक्ति आदेश
  - तिथि वृद्धि
  - दावा
  - आपत्ति
  - चयन सूची
  - प्रतीक्षा सूची
  - मेरिट सूची
  - पात्र/अपात्र
  - अपात्र
  - अनंतिम सूची
  - अंतिम सूची
  - परीक्षा परिणाम
  - परिणाम
  - शुद्धि पत्र
  - संशोधन
  - कौशल परीक्षा

# Tier A = instant Telegram alert.
tier_a:
  # Strong terms: match in head OR advert PDF.
  strong:
    - programmer
    - re:\bassistant\s+programmer\b
    - re:\bdata\s*entry\b
    - re:\bcomputer\s+(operator|programmer|assistant|instructor|teacher|science|applications?|engineer|faculty)\b
    - re:\b(m|b)\.?\s?c\.?\s?a\.?\b
    # Saurabh treats all of these as one qualification: BCA, B.Sc IT/CS, MCA, M.Sc IT/CS,
    # B.Tech/M.Tech CSE/IT, B.E./M.E. CS, Bachelor's/Master's in Computer Science or
    # Computer Applications. Any of them anywhere in an advert is a match.
    # "(in|-)?" covers "B.Tech in IT", "M.Sc.-IT"; "\(?" covers "B.Sc. (IT)".
    # "IT" and "B.E."/"M.E." are case-sensitive so English like "be it a graduate…" can't match.
    - re:\b(m|b)\.?\s?sc\.?\s*(-|in\s+)?\(?\s*((?-i:IT)|cs|computer|information)\b
    - re:\b(b|m)\.?\s?tech\.?\s*(-|in\s+)?\(?\s*(cs|cse|(?-i:IT)|computer|information)\b
    - re:(?-i:\b[BM]\.?\s?E\b)\.?\s*(-|in\s+)?\(?\s*(cs|cse|(?-i:IT)|computer|information)\b
    - re:\b(pgdca|dca|o\s*level|a\s*level)\b
    - re:\binformation\s+technology\b
    - re:\bsoftware\b
    - re:\bsystem(s)?\s+(analyst|administrator|engineer|manager|officer)\b
    - re:\b(network|database|db)\s+(administrator|engineer|manager)\b
    - re:\b(it|i\.t\.)\s+(officer|assistant|manager|executive|consultant|coordinator|expert|professional|specialist|support)\b
    - re:\b(web|app|application|full[\s-]?stack|frontend|backend|python|java)\s+developer\b
    - re:\b(developer|data\s+analyst|data\s+scientist|mis\s+(assistant|coordinator|executive|expert))\b
    - re:\bscientist[\s-]*['"]?(b|c|sc|sd)['"]?\b
    - re:\bscientist\s*/\s*engineer\b
    - re:\b(sub[\s-]?engineer|junior\s+engineer|je|assistant\s+engineer)\s*[-(]?\s*civil
    - re:\bdiploma\s+(in\s+)?civil\b
    - re:\bcivil\s+engineer(ing)?\b
    # Statewide 2026 drive hiring Assistant Programmers in every Janpad. Districts spell it
    # many ways: VB-G-RAM-G, VB-GRAMG, VB-G Ram-G, Vikasit Bharat-Ji Ram-Ji, Viksit Bharat Guarantee Mission…
    - re:\b(vb[\s-]*)?g[\s-]*ram[\s-]*g\b
    - re:\bji[\s-]*ram[\s-]*ji\b
    - re:\bvi[kc]?a?s[ih]?t\s+bharat\b[^.]{0,60}(guarantee|rozgar|employment|livelihood|ram)
    - re:\bemployment\s+and\s+livelihood\b
    - जी राम जी
    - प्रोग्रामर
    - डाटा एंट्री
    - डेटा एंट्री
    - एम.सी.ए
    - एमसीए
    - बी.सी.ए
    - बीसीए
    - पीजीडीसीए
    - सूचना प्रौद्योगिकी
    - कम्प्यूटर ऑपरेटर
    - कंप्यूटर ऑपरेटर
    - कम्प्यूटर साइंस
    - कंप्यूटर साइंस
    - कम्प्यूटर एप्लीकेशन
    - कंप्यूटर एप्लीकेशन
    - कम्प्यूटर एप्लिकेशन
    - कंप्यूटर एप्लिकेशन
    - कम्प्यूटर अनुप्रयोग
    - कंप्यूटर अनुप्रयोग
    - उप अभियंता
    - उपअभियंता
    - सब इंजीनियर
    - रोजगार एवं आजीविका
  # Weak terms: too common inside PDFs ("computer knowledge required"), so they
  # only promote to tier A when they appear in the title/description.
  weak:
    - computer
    - cs:IT
    - cs:CSE
    - re:\bcivil\b
    - re:\btechnical\s+assistant\b
    - कम्प्यूटर
    - कंप्यूटर
    - सिविल
  # Combos: tier A only when a role word AND a computing word both appear (head or PDF).
  # A role word without the computing word goes to tier B.
  combos:
    research:
      role:
        - re:\b(jrf|srf)\b
        - re:\bjunior\s+research\s+fellow\b
        - re:\bproject\s+(staff|associate|assistant|engineer|fellow|scientist|manager|officer|consultant|technician)\b
        - re:\bresearch\s+(associate|assistant|scientist|engineer|fellow)\b
        - re:(?-i:\b(RA|PA|JPA|SPA|PE)\s*-\s*(I{1,3}|1|2|3)\b)   # "RA-II", "PA-1"; strict so OCR noise like "Ra 2" doesn't count
      # Evidence that the post is in YOUR field. Only specific terms: words like "data",
      # "web", "network" or "cloud" turn up in biology, climate and survey projects (and
      # in website addresses), so they don't count.
      with: &computing
        - re:\bcomput\w*
        - cs:CS
        - cs:CSE
        - cs:IT
        - cs:AI
        - cs:ML
        - cs:IoT
        - cs:NLP
        - cs:MCA
        - cs:BCA
        - software
        - re:\b(machine\s+learning|deep\s+learning|artificial\s+intelligence|data\s+science|cyber\s*security|programming|python|java|full[\s-]?stack|database\s+(management|administration))\b
        - re:\binformation\s+technology\b
        - कम्प्यूटर
        - कंप्यूटर
    teaching:
      role:
        - re:\b(assistant|associate)\s+professor\b
        - re:\b(lecturer|guest\s+faculty|guest\s+lecturer|faculty|teaching\s+assistant|instructor|tutor)\b
        - व्याख्याता
        - अतिथि शिक्षक
        - अतिथि व्याख्याता
        - सहायक प्राध्यापक
      with: *computing

# Tier B = daily digest. Any-graduate posts and anything uncertain.
tier_b:
  - re:\b(sub[\s-]?engineer|junior\s+engineer)\b   # non-civil branches: worth a look, not an alert
  - re:\bany\s+(graduate|degree)\b
  - re:\bgraduat(e|ion)\b
  - re:\bbachelor'?s?\s+degree\b
  - re:\bpost[\s-]?graduat\w*
  - स्नातक
  - स्नातकोत्तर

# Tier C = stored and shown on the dashboard, no alert. Only applied when the
# head matches one of these AND nothing from tier A/B matched anywhere.
tier_c:
  - re:\b(staff\s+)?nurse\b
  - re:\b(anm|gnm|mpw|chc|phc)\b
  - re:\b(pharmacist|mbbs|medical\s+officer|doctor|dental|physiotherap\w*|radiographer|lab(oratory)?\s+technician|optometr\w*|ophthalmic|psychologist|counsell?or|dietician)\b
  - re:\b(driver|peon|chowkidar|watchman|security\s+guard|guard|cook|sweeper|cleaner|attendant|mali|gardener|dai)\b
  - re:\b(anganwadi|aanganwadi|midwife|ayush|veterinary|physical\s+education|b\.?p\.?ed)\b
  - re:\b(iti|electrician|plumber|fitter|welder|turner|carpenter|mason|kotwar)\b
  - नर्स
  - फार्मासिस्ट
  - चिकित्सा अधिकारी
  - वाहन चालक
  - भृत्य
  - चौकीदार
  - आंगनबाड़ी
  - रसोइया
  - स्वीपर

# Region filter for all-India aggregators (sources with `region_filter: true`).
# Wanted: Chhattisgarh (home domicile), MP, Odisha, Delhi, Maharashtra, Telangana,
# central government and all-India posts. Other states' posts usually need their
# domicile, so a title naming one is dropped, unless it also names a central /
# all-India body ("Assam Rifles", "Central University of Rajasthan", "NIT Patna").
region_filter:
  keep:
    - re:\b(central\s+university|aiims|iits?|iiits?|nits?|iims?|iiser|niser|ignou|esic|epfo|nta|ugc|csir|icar|icmr|ncert)\b
    - re:\b(rrb|rrc|railways?|kvs|kendriya\s+vidyalaya|navodaya|nvs|india\s+post|postal|gds)\b
    - re:\b(assam\s+rifles|indian\s+(army|navy|air\s*force|coast\s+guard|oil|bank)|army|navy|air\s*force|bsf|crpf|cisf|itbp|ssb|nda|cds)\b
    - re:\b(punjab\s+national\s+bank|punjab\s*(&|and)\s*sind\s+bank|bank\s+of\s+maharashtra|sbi|rbi|nabard|lic|ibps)\b
    - re:\b(upsc|ssc|isro|drdo|barc|bel|bhel|ntpc|coal\s+india|ongc|iocl|gail|hal|sail|nhpc|powergrid|rites|c-?dac|nielit|fci|cwc|supreme\s+court)\b
  block:
    - cs:UP
    - re:\b(uttar\s+pradesh|upsssc|uppsc|upessc|upsessb|uppbpb|uppcl|upsrtc|upnhm|upcisb|up\s+police)\b
    - re:\b(bihar|bpsc|bssc|bpssc|csbc|bsphcl|beltron)\b
    - re:\b(rajasthan|rpsc|rsmssb|rssb)\b
    - re:\b(haryana|hssc|hpsc|hkrn)\b
    - re:\b(punjab|psssb|ppsc|pspcl)\b
    - re:\b(himachal|hppsc|hpssc|hprca)\b
    - cs:HP
    - re:\b(uttarakhand|uksssc|ukpsc|ukmssb)\b
    - re:\b(jharkhand|jssc|jpsc)\b
    - re:\b(west\s+bengal|wbssc|wbpsc|wbprb|wbhrb)\b
    - cs:WB
    - re:\bassam\b
    - re:\b(gujarat|gsssb|gpsc|gsrtc|ojas)\b
    - re:\b(karnataka|kpsc|kea)\b
    - re:\bkerala\b
    - re:\b(tamil\s*nadu|tnpsc|tnusrb)\b
    - cs:TN
    - re:\b(andhra\s+pradesh|appsc|apslprb)\b
    - cs:AP
    - re:\b(jammu|kashmir|j\s*&\s*k|jkssb|jkpsc|ladakh)\b
    - re:\b(goa|sikkim|tripura|manipur|meghalaya|mizoram|nagaland|arunachal|puducherry|pondicherry|chandigarh|andaman|lakshadweep|dadra|daman)\b

# Application deadline detection in advert text.
# deadline_before: phrase within ~80 characters BEFORE a date ("last date ... 06/11/2026").
# deadline_after:  word within ~25 characters AFTER a date ("06/11/2026 तक" = "until").
deadline_before:
  - re:last\s+date
  - re:closing\s+date
  - re:on\s+or\s+before
  - re:due\s+date
  - re:not\s+later\s+than
  - अंतिम तिथि
  - अंतिम दिनांक
  - अंतिम तारीख
deadline_after:
  - तक
  - re:\btill\b
  - re:\bupto\b
