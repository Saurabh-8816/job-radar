<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Job Radar</title>
<meta name="description" content="Govt, PSU and research jobs that match your profile.">
<meta name="theme-color" content="#0c2340">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Job Radar">
<style>
:root {
  --bg: #f4f6f9; --surface: #ffffff; --surface-2: #eef2f7; --text: #142033; --muted: #5b6b80;
  --line: #dbe2ea; --brand: #0c2340; --accent: #0f9488; --accent-soft: #d6f3ef;
  --hot: #c2261b; --hot-soft: #fde6e3; --warm: #a35a00; --warm-soft: #fff0d6;
  --ok: #18794e; --ok-soft: #dcf3e6; --star: #b7791f; --chip: #e8edf3;
  --shadow: 0 1px 2px rgba(16, 32, 51, .06), 0 2px 8px rgba(16, 32, 51, .05); --on-accent: #ffffff;
  --radius: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1422; --surface: #121e30; --surface-2: #192840; --text: #e6edf6; --muted: #9aabc0;
    --line: #24354f; --brand: #0c2340; --accent: #4fd1c5; --accent-soft: #123b3d;
    --hot: #ff8a7d; --hot-soft: #3a1c1c; --warm: #ffc36b; --warm-soft: #3a2a12;
    --ok: #6fdba3; --ok-soft: #133526; --star: #f6c453; --chip: #1d2c45;
    --shadow: none; --on-accent: #062a27; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1422; --surface: #121e30; --surface-2: #192840; --text: #e6edf6; --muted: #9aabc0;
  --line: #24354f; --brand: #0c2340; --accent: #4fd1c5; --accent-soft: #123b3d;
  --hot: #ff8a7d; --hot-soft: #3a1c1c; --warm: #ffc36b; --warm-soft: #3a2a12;
  --ok: #6fdba3; --ok-soft: #133526; --star: #f6c453; --chip: #1d2c45;
  --shadow: none; --on-accent: #062a27; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Noto Sans Devanagari", sans-serif;
  -webkit-text-size-adjust: 100%;
}
a { color: inherit; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* top bar */
.bar {
  position: sticky; top: 0; z-index: 10; background: var(--brand); color: #fff;
  padding: calc(env(safe-area-inset-top) + 10px) 16px 0;
}
.bar-row { max-width: 820px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
.logo { width: 28px; height: 28px; border-radius: 7px; flex: none; }
.bar h1 { font-size: 18px; margin: 0; font-weight: 650; letter-spacing: .2px; }
.updated { font-size: 12px; opacity: .75; margin-left: auto; text-align: right; white-space: nowrap; }
.pill { font-size: 11px; padding: 2px 8px; border-radius: 99px; background: rgba(255,255,255,.14); }
.pill.off { background: #f59e0b; color: #1f1300; }
.install { border: 0; background: #5eead4; color: #062a27; font-weight: 600; padding: 6px 12px; border-radius: 99px; font-size: 13px; }
.tabs {
  max-width: 820px; margin: 10px auto 0; display: flex; gap: 4px; overflow-x: auto;
  scrollbar-width: none; -webkit-overflow-scrolling: touch;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: none; border: 0; background: transparent; color: rgba(255,255,255,.72); padding: 9px 12px 11px;
  font-size: 14px; font-weight: 550; border-bottom: 3px solid transparent; white-space: nowrap;
}
.tab[aria-selected="true"] { color: #fff; border-bottom-color: #5eead4; }
.tab .n { font-size: 11px; background: rgba(255,255,255,.16); border-radius: 99px; padding: 1px 6px; margin-left: 4px; }
.tab[aria-selected="true"] .n { background: #5eead4; color: #062a27; }

main { max-width: 820px; margin: 0 auto; padding: 12px 16px calc(env(safe-area-inset-bottom) + 40px); }

/* search + filters */
.tools { display: flex; gap: 8px; margin-bottom: 10px; }
.search {
  flex: 1; min-width: 0; height: 42px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface); padding: 0 12px; outline: none;
}
.search:focus { border-color: var(--accent); }
.btn {
  height: 42px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface);
  padding: 0 14px; font-weight: 550; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
.btn .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.sheet {
  display: none; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 12px; margin-bottom: 12px; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
}
.sheet.open { display: grid; }
.sheet label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
.sheet select { height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); padding: 0 8px; }
.sheet .check { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text); }
.sheet .reset { align-self: end; }

.banner {
  display: flex; align-items: center; gap: 10px; background: var(--accent-soft); color: var(--text);
  border-radius: 12px; padding: 10px 12px; margin-bottom: 12px; font-size: 14px;
}
.banner b { color: var(--accent); }
.banner button { margin-left: auto; border: 0; background: transparent; color: var(--muted); font-size: 13px; }
.count { color: var(--muted); font-size: 13px; margin: 2px 2px 8px; }

/* cards */
.list { display: grid; gap: 10px; }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 12px 14px; box-shadow: var(--shadow); position: relative;
}
.card.is-new::before {
  content: ""; position: absolute; left: -1px; top: 14px; bottom: 14px; width: 3px; border-radius: 3px; background: var(--accent);
}
.card.applied, .card.hidden { opacity: .72; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.chip { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--chip); color: var(--muted); font-weight: 550; }
.chip.dl.hot { background: var(--hot-soft); color: var(--hot); }
.chip.dl.warm { background: var(--warm-soft); color: var(--warm); }
.chip.dl.closed { text-decoration: line-through; }
.chip.new { background: var(--accent-soft); color: var(--accent); }
.chip.tA { background: var(--ok-soft); color: var(--ok); }
.chip.upd { background: var(--warm-soft); color: var(--warm); }
.chip.st { background: var(--accent-soft); color: var(--accent); }
.title { font-size: 15.5px; font-weight: 600; margin: 8px 0 3px; line-height: 1.35; overflow-wrap: anywhere; }
.title a { text-decoration: none; }
.title a:hover, .title a:active { text-decoration: underline; color: var(--accent); }
.org { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.terms { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.terms span { font-size: 12px; padding: 1px 7px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); }
details { margin-top: 8px; font-size: 13px; color: var(--muted); }
details summary { cursor: pointer; color: var(--accent); font-weight: 550; list-style: none; }
details summary::-webkit-details-marker { display: none; }
details p { margin: 6px 0 0; overflow-wrap: anywhere; }
details .docs { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 6px; }
details .docs a { color: var(--accent); }
.actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.act {
  border: 1px solid var(--line); background: var(--surface); border-radius: 10px; height: 36px;
  padding: 0 11px; font-size: 13px; font-weight: 550; display: inline-flex; align-items: center; gap: 5px;
}
.act[aria-pressed="true"].save { background: var(--warm-soft); border-color: transparent; color: var(--star); }
.act[aria-pressed="true"].done { background: var(--ok-soft); border-color: transparent; color: var(--ok); }
.act.icon { width: 36px; padding: 0; justify-content: center; color: var(--muted); text-decoration: none; }
.act.icon svg { width: 17px; height: 17px; }
.act.icon:last-child { margin-left: auto; }
.id { font-size: 11.5px; color: var(--muted); margin-top: 8px; }
.empty { text-align: center; color: var(--muted); padding: 40px 12px; }
.more { width: 100%; margin-top: 10px; justify-content: center; }

/* sources page */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
.stat b { display: block; font-size: 22px; }
.stat span { font-size: 12px; color: var(--muted); }
.src { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 13px; }
.src a { font-weight: 600; text-decoration: none; }
.src div { color: var(--muted); overflow-wrap: anywhere; }
.note { font-size: 13px; color: var(--muted); margin: 0 0 12px; }

.toast {
  position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 16px); transform: translateX(-50%) translateY(140%);
  background: #142033; color: #fff; padding: 10px 14px; border-radius: 12px; display: flex; gap: 12px; align-items: center;
  font-size: 14px; max-width: calc(100% - 32px); transition: transform .2s ease, visibility .2s; z-index: 30;
  box-shadow: 0 6px 24px rgba(0,0,0,.25); visibility: hidden;
}
.toast.show { transform: translateX(-50%) translateY(0); visibility: visible; }
.toast a { color: #5eead4; font-weight: 600; white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
@media (min-width: 700px) { .title { font-size: 16.5px; } }
</style>
</head>
<body>
<header class="bar">
  <div class="bar-row">
    <img class="logo" src="icon-192.png" alt="">
    <h1>Job Radar</h1>
    <span class="pill off" id="offline" hidden>Offline</span>
    <button class="install" id="install" hidden>Install</button>
    <span class="updated" id="updated"></span>
  </div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Views"></nav>
</header>

<main>
  <div id="jobs-view">
    <div class="tools">
      <input class="search" type="search" id="q" placeholder="Search post, institute, district…" aria-label="Search jobs" autocomplete="off">
      <button class="btn" id="filter-btn" aria-expanded="false" aria-controls="sheet">Filters</button>
    </div>
    <div class="sheet" id="sheet">
      <label>Area <select id="area"><option value="">All areas</option></select></label>
      <label>State <select id="state"><option value="">All states</option></select></label>
      <label>Closing within <select id="within">
        <option value="">Any time</option><option value="3">3 days</option><option value="7">7 days</option>
        <option value="15">15 days</option><option value="30">30 days</option></select></label>
      <label>Sort <select id="sort">
        <option value="">Best for this view</option><option value="deadline">Soonest deadline</option><option value="new">Newest first</option></select></label>
      <label class="check"><input type="checkbox" id="closed"> Include closed</label>
      <button class="btn reset" id="reset">Reset filters</button>
    </div>
    <div class="banner" id="banner" hidden></div>
    <div class="count" id="count" aria-live="polite"></div>
    <div class="list" id="list"></div>
  </div>
  <div id="sources-view" hidden></div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script id="data" type="application/json">__DATA__</script>
<script>
"use strict";
const DATA = JSON.parse(document.getElementById("data").textContent);
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem("jr-" + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("jr-" + k, JSON.stringify(v)); } catch (e) {} },
};

// ---- dates (India time) ----------------------------------------------------
const today = new Date(new Date().toLocaleString("en-US", {timeZone: "Asia/Kolkata"}));
today.setHours(0, 0, 0, 0);
const daysLeft = (d) => (d ? Math.round((new Date(d + "T00:00:00") - today) / 864e5) : null);
const fmt = (d) => new Date(d + "T00:00:00").toLocaleDateString("en-IN", {day: "numeric", month: "short"});
function ago(iso) {
  const m = Math.round((Date.now() - new Date(iso)) / 6e4);
  if (m < 2) return "just now";
  if (m < 60) return m + " min ago";
  const h = Math.round(m / 60);
  return h < 24 ? h + " h ago" : Math.round(h / 24) + " d ago";
}

// ---- my status: phone first, synced to the bot by a Telegram link ----------
const local = store.get("status", {});              // id -> "starred" | "applied" | "hidden" | ""
const statusOf = (i) => (i.id in local ? local[i.id] : i.status) || "";
const VERB = {starred: "star", applied: "applied", hidden: "hide", "": "unhide"};
function setStatus(i, status) {
  local[i.id] = status;
  store.set("status", local);
  const said = {starred: "Saved", applied: "Marked applied", hidden: "Hidden", "": "Cleared"}[status];
  toast(`${said} on this phone.`, DATA.bot ? {
    label: "Sync to bot", href: `https://t.me/${DATA.bot}?start=${VERB[status]}_${i.id}`,
  } : null, status === "hidden" ? {label: "Undo", run: () => setStatus(i, "")} : null);
  render();
}

// ---- "new since your last visit" -------------------------------------------
const lastVisit = store.get("last-visit", null);
const isNew = (i) => lastVisit && i.at > lastVisit;
addEventListener("pagehide", () => store.set("last-visit", DATA.updated));

// ---- views -----------------------------------------------------------------
const open = (i) => i.deadline === null || daysLeft(i.deadline) >= 0;
const live = (i) => statusOf(i) !== "hidden";
const VIEWS = [
  {id: "foryou", label: "For you", test: (i) => i.tier === "A" && i.kind === "new" && live(i), sort: "deadline",
   empty: "No open matches right now. New ones arrive on Telegram the moment they're found."},
  {id: "closing", label: "Closing soon", test: (i) => i.kind === "new" && i.tier !== "C" && i.deadline && daysLeft(i.deadline) >= 0 && daysLeft(i.deadline) <= 7 && live(i) && statusOf(i) !== "applied", sort: "deadline",
   empty: "Nothing you might want closes in the next 7 days."},
  {id: "maybe", label: "Worth a look", test: (i) => i.tier === "B" && i.kind === "new" && live(i), sort: "new",
   empty: "Nothing here. These are posts that might fit: any-graduate jobs, unclear fields, unreadable adverts."},
  {id: "updates", label: "Updates", test: (i) => i.kind === "update" && i.tier !== "C" && live(i), sort: "new",
   empty: "No results, merit lists or date changes."},
  {id: "saved", label: "Saved", test: (i) => ["starred", "applied"].includes(statusOf(i)), sort: "deadline", allClosed: true,
   empty: "Tap ☆ Save on a job to keep it here. The bot reminds you 3 days and 1 day before it closes."},
  {id: "all", label: "All", test: () => true, sort: "new", empty: "Nothing matches."},   // hidden ones too, to unhide
  {id: "sources", label: "Sources"},
];
const params = new URLSearchParams(location.search);
const state = {view: params.get("tab") || store.get("view", "foryou"), shown: 60, ...store.get("filters", {})};
if (!VIEWS.some((v) => v.id === state.view)) state.view = "foryou";

function counts() {
  const n = {};
  for (const v of VIEWS) if (v.test) n[v.id] = DATA.items.filter((i) => v.test(i) && (v.allClosed || open(i))).length;
  return n;
}
function renderTabs() {
  const n = counts();
  $("tabs").innerHTML = VIEWS.map((v) => `<button class="tab" role="tab" data-v="${v.id}" aria-selected="${state.view === v.id}">${v.label}${
    v.id in n && v.id !== "all" ? `<span class="n">${n[v.id]}</span>` : ""}</button>`).join("");
  const sel = $("tabs").querySelector('[aria-selected="true"]');
  if (sel) $("tabs").scrollLeft = sel.offsetLeft - ($("tabs").clientWidth - sel.offsetWidth) / 2;
}
$("tabs").addEventListener("click", (e) => {
  const b = e.target.closest(".tab"); if (!b) return;
  state.view = b.dataset.v; state.shown = 60; store.set("view", state.view);
  history.replaceState(null, "", "?tab=" + state.view);
  render(); scrollTo({top: 0});
});

// ---- filters -----------------------------------------------------------------
const FILTERS = ["area", "state", "within", "sort", "closed"];
const fill = (sel, values) => values.forEach((v) => sel.insertAdjacentHTML("beforeend", `<option>${esc(v)}</option>`));
fill($("area"), [...new Set(DATA.items.map((i) => i.area))].sort());
fill($("state"), [...new Set(DATA.items.map((i) => i.state).filter((s) => s && s !== "IN"))].sort());
for (const f of FILTERS) {
  const el = $(f);
  if (state[f] !== undefined) el.type === "checkbox" ? (el.checked = state[f]) : (el.value = state[f]);
  el.addEventListener("input", () => { state[f] = el.type === "checkbox" ? el.checked : el.value; saveFilters(); state.shown = 60; render(); });
}
function saveFilters() { store.set("filters", Object.fromEntries(FILTERS.map((f) => [f, state[f]]))); }
const activeFilters = () => FILTERS.filter((f) => state[f]).length;
$("filter-btn").addEventListener("click", () => {
  const openNow = $("sheet").classList.toggle("open");
  $("filter-btn").setAttribute("aria-expanded", openNow);
});
$("reset").addEventListener("click", () => {
  for (const f of FILTERS) { state[f] = f === "closed" ? false : ""; const el = $(f); el.type === "checkbox" ? (el.checked = false) : (el.value = ""); }
  saveFilters(); render();
});
let typing;
$("q").addEventListener("input", () => { clearTimeout(typing); typing = setTimeout(() => { state.shown = 60; render(); }, 120); });

// ---- cards -------------------------------------------------------------------
const svg = (d) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const ICON = {
  cal: svg('<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>'),
  share: svg('<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/>'),
  hide: svg('<path d="M3 3l18 18"/><path d="M10.6 5.1A10 10 0 0 1 12 5c6 0 9.5 7 9.5 7a17 17 0 0 1-2.7 3.6M6.6 6.6A17 17 0 0 0 2.5 12S6 19 12 19a9.7 9.7 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>'),
  eye: svg('<path d="M2.5 12S6 5 12 5s9.5 7 9.5 7-3.5 7-9.5 7S2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="3"/>'),
};
function deadlineChip(i) {
  if (!i.deadline) return `<span class="chip dl">No last date given</span>`;
  const n = daysLeft(i.deadline);
  if (n < 0) return `<span class="chip dl closed">Closed ${fmt(i.deadline)}</span>`;
  const when = n === 0 ? "Closes today" : n === 1 ? "Closes tomorrow" : `${n} days left`;
  return `<span class="chip dl ${n <= 3 ? "hot" : n <= 7 ? "warm" : ""}">${when} · ${fmt(i.deadline)}</span>`;
}
function calendarLink(i) {
  const d = i.deadline.replace(/-/g, "");
  const next = new Date(i.deadline + "T00:00:00"); next.setDate(next.getDate() + 1);
  const end = next.toISOString().slice(0, 10).replace(/-/g, "");
  const q = new URLSearchParams({action: "TEMPLATE", text: "Last date: " + i.title.slice(0, 90),
    dates: `${d}/${end}`, details: `${i.source}\n${i.url || i.page}`});
  return "https://calendar.google.com/calendar/render?" + q;
}
function card(i) {
  const s = statusOf(i);
  const place = [i.source, i.district && !String(i.source).includes(i.district) ? i.district : "", i.state && i.state !== "IN" ? i.state : ""]
    .filter(Boolean).join(" · ");
  const evidence = i.reasons.filter((r) => r.startsWith("advert p."));
  const why = i.reasons.filter((r) => !r.startsWith("advert p."));
  const docs = i.docs.map(([label, url]) => `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(label || "Document")}</a>`)
    .concat(`<a href="${esc(i.page)}" target="_blank" rel="noopener">Notice page</a>`);
  return `<article class="card ${isNew(i) ? "is-new" : ""} ${s}" data-id="${i.id}">
    <div class="row">
      ${deadlineChip(i)}
      ${isNew(i) ? `<span class="chip new">New</span>` : ""}
      ${i.tier === "A" ? `<span class="chip tA">Match</span>` : ""}
      ${i.kind === "update" ? `<span class="chip upd">Update</span>` : ""}
      ${s === "applied" ? `<span class="chip st">Applied</span>` : ""}
    </div>
    <div class="title"><a href="${esc(i.url || i.page)}" target="_blank" rel="noopener">${esc(i.title)}</a></div>
    <div class="org">${esc(place)}</div>
    ${i.matched.length ? `<div class="terms">${i.matched.slice(0, 6).map((m) => `<span>${esc(m)}</span>`).join("")}</div>` : ""}
    <details>
      <summary>Why it's here · documents</summary>
      ${evidence.map((e) => `<p>📄 ${esc(e)}</p>`).join("")}
      ${why.length ? `<p>${esc(why.join(" · "))}</p>` : ""}
      ${i.desc ? `<p>${esc(i.desc)}</p>` : ""}
      <div class="docs">${docs.join("")}</div>
    </details>
    <div class="actions">
      <button class="act save" data-do="starred" aria-pressed="${s === "starred"}">${s === "starred" ? "★ Saved" : "☆ Save"}</button>
      <button class="act done" data-do="applied" aria-pressed="${s === "applied"}">✓ Applied</button>
      ${i.deadline && daysLeft(i.deadline) >= 0 ? `<a class="act icon" href="${calendarLink(i)}" target="_blank" rel="noopener" aria-label="Add last date to calendar" title="Add last date to calendar">${ICON.cal}</a>` : ""}
      <button class="act icon" data-do="share" aria-label="Share" title="Share">${ICON.share}</button>
      <button class="act icon" data-do="hidden" aria-label="${s === "hidden" ? "Unhide" : "Hide"}" title="${s === "hidden" ? "Unhide" : "Not interested"}">${s === "hidden" ? ICON.eye : ICON.hide}</button>
    </div>
    <div class="id">#${i.id} · found ${esc(i.seen)}${i.doc === "ocr" ? " · scanned advert, read by OCR" : i.doc === "unreadable" ? " · advert unreadable, check it yourself" : ""}</div>
  </article>`;
}
$("list").addEventListener("click", async (e) => {
  const b = e.target.closest("button[data-do]"); if (!b) return;
  const i = byId.get(+b.closest(".card").dataset.id), what = b.dataset.do, s = statusOf(i);
  if (what === "share") {
    const text = `${i.title}\n${i.source}${i.deadline ? "\nLast date: " + fmt(i.deadline) : ""}`;
    const url = i.url || i.page;
    if (navigator.share) { try { await navigator.share({title: i.title, text, url}); } catch (err) {} }
    else open_(`https://wa.me/?text=${encodeURIComponent(text + "\n" + url)}`);
    return;
  }
  setStatus(i, s === what ? "" : what);
});
const open_ = (u) => window.open(u, "_blank", "noopener");
const byId = new Map(DATA.items.map((i) => [i.id, i]));

// ---- render ------------------------------------------------------------------
function rows(view) {
  const q = $("q").value.trim().toLowerCase();
  let out = DATA.items.filter((i) =>
    view.test(i) &&
    (state.closed || view.allClosed || open(i)) &&
    (!state.area || i.area === state.area) &&
    (!state.state || i.state === state.state) &&
    (!state.within || (i.deadline && daysLeft(i.deadline) >= 0 && daysLeft(i.deadline) <= +state.within)) &&
    (!q || i.search.includes(q)));
  const sort = state.sort || view.sort;
  out.sort(sort === "new"
    ? (a, b) => b.at.localeCompare(a.at) || b.id - a.id
    : (a, b) => {
        const da = a.deadline && daysLeft(a.deadline) >= 0 ? a.deadline : "9999", db = b.deadline && daysLeft(b.deadline) >= 0 ? b.deadline : "9999";
        return da.localeCompare(db) || b.at.localeCompare(a.at);
      });
  return out;
}
function render() {
  renderTabs();
  const view = VIEWS.find((v) => v.id === state.view);
  $("jobs-view").hidden = view.id === "sources";
  $("sources-view").hidden = view.id !== "sources";
  if (view.id === "sources") return renderSources();
  $("filter-btn").innerHTML = "Filters" + (activeFilters() ? ` <span class="dot" aria-label="${activeFilters()} active"></span>` : "");
  const list = rows(view);
  const fresh = lastVisit ? list.filter(isNew).length : 0;
  $("banner").hidden = !fresh;
  $("banner").innerHTML = fresh ? `<span><b>${fresh} new</b> since your last visit</span>` : "";
  $("count").textContent = list.length ? `${list.length} ${list.length === 1 ? "job" : "jobs"}` : "";
  $("list").innerHTML = list.length
    ? list.slice(0, state.shown).map(card).join("") + (list.length > state.shown ? `<button class="btn more" id="more">Show ${Math.min(60, list.length - state.shown)} more</button>` : "")
    : `<div class="empty">${esc(view.empty)}${activeFilters() || $("q").value ? "<br>Try clearing the search or filters." : ""}</div>`;
  const more = $("more");
  if (more) more.onclick = () => { state.shown += 60; render(); };
}
function renderSources() {
  const h = DATA.health;
  const relay = h.relay_last ? `Laptop relay: last check-in ${ago(h.relay_last)}.` : "The laptop relay hasn't checked in yet.";
  $("sources-view").innerHTML = `
    <div class="stats">
      <div class="stat"><b>${h.total.toLocaleString("en-IN")}</b><span>sites watched</span></div>
      <div class="stat"><b>${h.healthy.toLocaleString("en-IN")}</b><span>answered last check</span></div>
      <div class="stat"><b>${h.failed.toLocaleString("en-IN")}</b><span>not reachable</span></div>
    </div>
    <p class="note">${esc(relay)} Sites that refuse GitHub are fetched by your laptop, and every failure is retried automatically. Listed below: sites that failed 3 or more checks in a row, or changed their page layout.</p>
    <div class="list">${h.unhealthy.map((s) => `<div class="src">
      <a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}</a>
      <div>${esc(s.problem)}</div></div>`).join("") || `<div class="empty">No site has failed 3 checks in a row.</div>`}</div>`;
}

// ---- toast -------------------------------------------------------------------
let toastTimer;
function toast(text, link, action) {
  const t = $("toast");
  t.innerHTML = `<span>${esc(text)}</span>` + (link ? `<a href="${esc(link.href)}" target="_blank" rel="noopener">${esc(link.label)}</a>` : "")
    + (action ? `<a href="#" id="toast-act">${esc(action.label)}</a>` : "");
  if (action) $("toast-act").onclick = (e) => { e.preventDefault(); action.run(); };
  t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 5000);
}

// ---- app shell: install, offline, background refresh ------------------------
for (const i of DATA.items) i.search = [i.title, i.desc, i.source, i.district, i.state, i.area, i.matched.join(" ")].join(" ").toLowerCase();
$("updated").textContent = "Updated " + ago(DATA.updated);
setInterval(() => ($("updated").textContent = "Updated " + ago(DATA.updated)), 60000);
const net = () => ($("offline").hidden = navigator.onLine);
addEventListener("online", net); addEventListener("offline", net); net();
let installEvent;
addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); installEvent = e; $("install").hidden = false; });
$("install").addEventListener("click", async () => { $("install").hidden = true; installEvent.prompt(); installEvent = null; });
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
render();
</script>
</body>
