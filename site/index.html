<html lang="en">

<title>Job Radar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --surface-2:#F5F7F9; --ink:#15202B; --ink-2:#3D4B58; --muted:#6A7783;
  --rule:#D5DCE2; --accent:#2C4A9A; --accent-soft:#E2E8F6;
  --a:#1F7A4A; --a-soft:#DDEFE4; --b:#8A6410; --b-soft:#F5EBD3; --c:#6A7783; --c-soft:#E6EAEE;
  --hot:#B5362D; --hot-soft:#F6DEDB; --warm:#9A5B0C; --warm-soft:#F6E7D1;
  --sans:"IBM Plex Sans","Noto Sans Devanagari","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E141A; --surface:#161E26; --surface-2:#1C252E; --ink:#E4EAF0; --ink-2:#B3C0CB; --muted:#8495A3;
  --rule:#27333E; --accent:#8FA8EC; --accent-soft:#1E2A47;
  --a:#5CC48A; --a-soft:#14301F; --b:#D9AE52; --b-soft:#33280F; --c:#8495A3; --c-soft:#222C35;
  --hot:#EE8178; --hot-soft:#3A1916; --warm:#E3A55A; --warm-soft:#36250F;
}}
:root[data-theme="dark"]{
  --bg:#0E141A; --surface:#161E26; --surface-2:#1C252E; --ink:#E4EAF0; --ink-2:#B3C0CB; --muted:#8495A3;
  --rule:#27333E; --accent:#8FA8EC; --accent-soft:#1E2A47;
  --a:#5CC48A; --a-soft:#14301F; --b:#D9AE52; --b-soft:#33280F; --c:#8495A3; --c-soft:#222C35;
  --hot:#EE8178; --hot-soft:#3A1916; --warm:#E3A55A; --warm-soft:#36250F;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
.wrap{max-width:980px;margin:0 auto;padding:0 16px 64px}
header{padding:28px 0 18px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between}
h1{font-size:1.5rem;letter-spacing:-.01em;margin:0;font-weight:600}
.updated{font:12px var(--mono);color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:12px 14px;cursor:pointer;text-align:left;color:inherit;font:inherit}
.stat:hover,.stat:focus-visible{border-color:var(--accent)}
.stat b{display:block;font:600 1.5rem/1.1 var(--sans);font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:10px;position:sticky;top:0;z-index:5}
.filters input[type=search]{flex:1 1 220px;min-width:0;padding:8px 10px;border:1px solid var(--rule);border-radius:4px;background:var(--surface-2);color:var(--ink);font:inherit}
select{padding:7px 8px;border:1px solid var(--rule);border-radius:4px;background:var(--surface-2);color:var(--ink);font:inherit;font-size:14px}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:4px;overflow:hidden}
.seg button{border:0;background:var(--surface-2);color:var(--ink-2);padding:7px 10px;font:500 13px var(--sans);cursor:pointer}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed=true]{background:var(--accent-soft);color:var(--accent)}
label.tog{font-size:13.5px;color:var(--ink-2);display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.count{font:12px var(--mono);color:var(--muted);margin:14px 2px 8px}
.list{display:grid;gap:10px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:14px 16px;display:grid;gap:7px}
.card.A{border-left:3px solid var(--a)}
.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{font:500 11px var(--mono);letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:3px;white-space:nowrap}
.t-A{background:var(--a-soft);color:var(--a)} .t-B{background:var(--b-soft);color:var(--b)} .t-C{background:var(--c-soft);color:var(--c)}
.k-update{border:1px solid var(--rule);color:var(--muted)}
.st{background:var(--accent-soft);color:var(--accent)}
.dl{margin-left:auto;font:500 12.5px var(--mono);padding:2px 8px;border-radius:3px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.dl.hot{background:var(--hot-soft);color:var(--hot)} .dl.warm{background:var(--warm-soft);color:var(--warm)} .dl.closed{text-decoration:line-through;color:var(--muted)}
.title{font-weight:600;font-size:15.5px;line-height:1.4;text-wrap:pretty}
.title a{color:var(--ink);text-decoration:none} .title a:hover{color:var(--accent);text-decoration:underline}
.meta{font-size:13px;color:var(--muted)}
.desc{font-size:13.5px;color:var(--ink-2)}
.why{display:flex;flex-wrap:wrap;gap:5px}
.why span{font:12px var(--mono);background:var(--surface-2);border:1px solid var(--rule);padding:1px 6px;border-radius:3px;color:var(--ink-2)}
.docs{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px}
.id{font:12px var(--mono);color:var(--muted)}
.empty{padding:40px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--rule);border-radius:6px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:600px){.dl{margin-left:0}.filters{position:static}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Job Radar</h1>
    <div class="updated" id="updated"></div>
  </header>

  <div class="stats" id="stats"></div>

  <div class="filters" role="search">
    <input type="search" id="q" placeholder="Search title, district, institute, keyword…" aria-label="Search">
    <div class="seg" id="tier" aria-label="Tier">
      <button data-v="A" aria-pressed="true" title="Instant matches">A</button>
      <button data-v="B" aria-pressed="true" title="Worth a look">B</button>
      <button data-v="C" aria-pressed="false" title="Other domains">C</button>
    </div>
    <select id="area" aria-label="Area"><option value="">All areas</option></select>
    <select id="kind" aria-label="Type">
      <option value="new">Vacancies</option><option value="update">Updates</option><option value="">Both</option>
    </select>
    <select id="within" aria-label="Closing within">
      <option value="">Any deadline</option><option value="3">Closing ≤ 3 days</option>
      <option value="7">≤ 7 days</option><option value="14">≤ 14 days</option><option value="30">≤ 30 days</option>
    </select>
    <select id="status" aria-label="My status">
      <option value="">All</option><option value="starred">Starred</option><option value="applied">Applied</option><option value="hidden">Hidden</option>
    </select>
    <select id="sort" aria-label="Sort">
      <option value="deadline">Soonest deadline</option><option value="new">Newest first</option>
    </select>
    <label class="tog"><input type="checkbox" id="open" checked> Open only</label>
  </div>

  <div class="count" id="count"></div>
  <div class="list" id="list"></div>
</div>

s3waas.gov.in/s326dd0dbc6e3f4c8043749885523d6a25/uploads/2026/10/17924090401088.pdf", "page": "https://balrampur.gov.in/en/notice_category/recruitment/", "docs": [["View", "https://cdn.s3waas.gov.in/s326dd0dbc6e3f4c8043749885523d6a25/uploads/2026/10/17924090401088.pdf"]], "source": "Balrampur district", "district": "Balrampur", "state": "CG", "area": "CG districts", "deadline": "2026-11-05", "seen": "2026-10-25", "kind": "new", "tier": "A", "matched": ["Viksit Bharat-Jee Ram", "जी राम जी"], "reasons": [], "doc": "ocr", "status": ""}, {"id": 2, "title": "Publication of advertisement for contractual recruitment to various posts under the Office of Zila Panchayat, Baloda Bazar-Bhatapara .", "desc": "Applications are invited from interested candidates via Registered Post or Speed Post only, from 09/10/2026 until 05:30 PM on 31/10/2026.", "url": "https://cdn.s3waas.gov.in/s304ecb1fa28506ccb6f72b12c0245ddbc/uploads/2026/10/17915508684537.pdf", "page": "https://balodabazar.gov.in/en/notice_category/recruitment/", "docs": [["View", "https://cdn.s3waas.gov.in/s304ecb1fa28506ccb6f72b12c0245ddbc/uploads/2026/10/17915508684537.pdf"], ["Programme Officer", "https://cdn.s3waas.gov.in/s304ecb1fa28506ccb6f72b12c0245ddbc/uploads/2026/10/17915509067718.pdf"], ["Computer Programmer", "https://cdn.s3waas.gov.in/s304ecb1fa28506ccb6f72b12c0245ddbc/uploads/2026/10/17915509558313.pdf"], ["Assistant Programmer", "https://cdn.s3waas.gov.in/s304ecb1fa28506ccb6f72b12c0245ddbc/uploads/2026/10/17915509893187.pdf"], ["Accountant", "https://cdn.s3waas.gov.in/s304ecb1fa28506ccb6f72b12c0245ddbc/uploads/2026/10/17915510314143.pdf"]], "source": "Baloda Bazar district", "district": "Baloda Bazar", "state": "CG", "area": "CG districts", "deadline": "2026-10-30", "seen": "2026-10-25", "kind": "new", "tier": "A", "matched": ["Viksit Bharat - Guarantee for Rozgar & Aajeevika Mission (Gram"], "reasons": ["research post, field unclear"], "doc": "text", "status": ""}, {"id": 1, "title": "Publication of the provisional merit list of candidates for the recruitment of 03 Technical Assistant posts, following the resolution of claims and objections.", "desc": "For the aforementioned post, candidates have been shortlisted on a merit basis in a 1:10 ratio for each category. They are invited to appear for original document verification, a practical computer test, and an interview on 30.10.2026 at 11:00 AM in the conference hall of the Zila Panchayat, Baloda ", "url": "https://cdn.s3waas.gov.in/s304ecb1fa28506ccb6f72b12c0245ddbc/uploads/2026/10/17925851592137.pdf", "page": "https://balodabazar.gov.in/en/notice_category/recruitment/", "docs": [["View", "https://cdn.s3waas.gov.in/s304ecb1fa28506ccb6f72b12c0245ddbc/uploads/2026/10/17925851592137.pdf"], ["दावा आपत्ति निराकरण कार्यवाही विवरण", "https://cdn.s3waas.gov.in/s304ecb1fa28506ccb6f72b12c0245ddbc/uploads/2026/10/17925851871773.pdf"], ["अजजा. 01 पद मेरिट 10 सूची", "https://cdn.s3waas.gov.in/s304ecb1fa28506ccb6f72b12c0245ddbc/uploads/2026/10/17925852784719.pdf"], ["अ.जा. 01 पद मेरिट 10 सूची", "https://cdn.s3waas.gov.in/s304ecb1fa28506ccb6f72b12c0245ddbc/uploads/2026/10/17925853194971.pdf"], ["अनारक्षित 01 पद मेरिट 10 सूची", "https://cdn.s3waas.gov.in/s304ecb1fa28506ccb6f72b12c0245ddbc/uploads/2026/10/17925853548724.pdf"], ["TA Final Merit List 211026_compressed", "https://cdn.s3waas.gov.in/s304ecb1fa28506ccb6f72b12c0245ddbc/uploads/2026/10/17925853813387.pdf"]], "source": "Baloda Bazar district", "district": "Baloda Bazar", "state": "CG", "area": "CG districts", "deadline": "2026-10-30", "seen": "2026-10-25", "kind": "update", "tier": "A", "matched": ["computer", "Technical Assistant"], "reasons": [], "doc": "ocr", "status": ""}]}</script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const $ = id => document.getElementById(id);
const today = new Date(new Date().toLocaleString('en-US', {timeZone: 'Asia/Kolkata'}));
today.setHours(0,0,0,0);
const daysLeft = d => d ? Math.round((new Date(d + 'T00:00:00') - today) / 864e5) : null;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = d => new Date(d + 'T00:00:00').toLocaleDateString('en-IN', {day:'2-digit', month:'short', year:'numeric'});

const state = {tiers: new Set(['A','B'])};
try { const saved = JSON.parse(localStorage.getItem('jr-filters') || 'null'); if (saved) Object.assign(state, saved, {tiers: new Set(saved.tiers)}); } catch (e) {}

$('updated').textContent = 'Updated ' + new Date(DATA.updated).toLocaleString('en-IN', {dateStyle:'medium', timeStyle:'short'});
[...new Set(DATA.items.map(i => i.area))].sort().forEach(a => $('area').insertAdjacentHTML('beforeend', `<option>${esc(a)}</option>`));

const open = i => i.deadline === null || daysLeft(i.deadline) >= 0;
const stats = [
  ['Open matches (A)', i => i.tier === 'A' && i.kind === 'new' && open(i) && i.status !== 'hidden', {tiers:['A'], kind:'new', within:'', open:true}],
  ['Closing ≤ 7 days', i => i.kind === 'new' && i.tier !== 'C' && i.deadline && daysLeft(i.deadline) >= 0 && daysLeft(i.deadline) <= 7, {tiers:['A','B'], kind:'new', within:'7', open:true}],
  ['Starred', i => i.status === 'starred', {status:'starred'}],
  ['New this week', i => (today - new Date(i.seen + 'T00:00:00')) / 864e5 <= 7 && i.kind === 'new', {tiers:['A','B','C'], kind:'new', sort:'new', within:''}],
];
$('stats').innerHTML = stats.map(([label, fn], n) =>
  `<button class="stat" data-n="${n}"><b>${DATA.items.filter(fn).length}</b><span>${label}</span></button>`).join('');
$('stats').addEventListener('click', e => {
  const b = e.target.closest('.stat'); if (!b) return;
  const preset = stats[+b.dataset.n][2];
  if (preset.tiers) state.tiers = new Set(preset.tiers);
  for (const k of ['kind','within','status','sort']) if (k in preset) $(k).value = preset[k];
  if ('open' in preset) $('open').checked = preset.open;
  if (!('status' in preset)) $('status').value = '';
  syncTier(); render();
});

function syncTier() { document.querySelectorAll('#tier button').forEach(b => b.setAttribute('aria-pressed', state.tiers.has(b.dataset.v))); }
$('tier').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  state.tiers.has(b.dataset.v) ? state.tiers.delete(b.dataset.v) : state.tiers.add(b.dataset.v);
  syncTier(); render();
});
for (const id of ['q','area','kind','within','status','sort','open']) $(id).addEventListener('input', render);
for (const id of ['area','kind','within','status','sort']) if (state[id] !== undefined) $(id).value = state[id];
if (state.open !== undefined) $('open').checked = state.open;
syncTier();

function deadlineChip(i) {
  if (!i.deadline) return '<span class="dl">No deadline listed</span>';
  const n = daysLeft(i.deadline);
  if (n < 0) return `<span class="dl closed">Closed ${fmt(i.deadline)}</span>`;
  const cls = n <= 3 ? 'hot' : n <= 7 ? 'warm' : '';
  const when = n === 0 ? 'today' : n === 1 ? 'tomorrow' : `in ${n} days`;
  return `<span class="dl ${cls}">Closes ${when} · ${fmt(i.deadline)}</span>`;
}

function card(i) {
  const place = [i.source, i.district && !String(i.source).includes(i.district) ? i.district : '', i.state && i.state !== 'IN' ? i.state : ''].filter(Boolean).join(' · ');
  const docs = i.docs.map(([label, url]) => `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(label || 'Document')}</a>`);
  docs.push(`<a href="${esc(i.page)}" target="_blank" rel="noopener">Notice page</a>`);
  const why = i.matched.length ? `<div class="why">${i.matched.map(m => `<span>${esc(m)}</span>`).join('')}</div>`
            : (i.reasons.length ? `<div class="meta">${esc(i.reasons.join(' · '))}</div>` : '');
  return `<article class="card ${i.tier}">
    <div class="top">
      <span class="chip t-${i.tier}">Tier ${i.tier}</span>
      ${i.kind === 'update' ? '<span class="chip k-update">Update</span>' : ''}
      ${i.status ? `<span class="chip st">${esc(i.status)}</span>` : ''}
      ${deadlineChip(i)}
    </div>
    <div class="title"><a href="${esc(i.url || i.page)}" target="_blank" rel="noopener">${esc(i.title)}</a></div>
    <div class="meta">${esc(place)}</div>
    ${i.desc ? `<div class="desc">${esc(i.desc)}</div>` : ''}
    ${why}
    <div class="docs">${docs.join('')}</div>
    <div class="id">#${i.id} · seen ${esc(i.seen)}${i.doc === 'ocr' ? ' · advert read by OCR' : i.doc === 'unreadable' ? ' · advert unreadable, check manually' : ''}</div>
  </article>`;
}

function render() {
  const q = $('q').value.trim().toLowerCase();
  const area = $('area').value, kind = $('kind').value, within = $('within').value, status = $('status').value;
  let rows = DATA.items.filter(i =>
    state.tiers.has(i.tier) &&
    (!area || i.area === area) &&
    (!kind || i.kind === kind) &&
    (status ? i.status === status : i.status !== 'hidden') &&
    (!$('open').checked || open(i)) &&
    (!within || (i.deadline && daysLeft(i.deadline) >= 0 && daysLeft(i.deadline) <= +within)) &&
    (!q || [i.title, i.desc, i.source, i.district, i.state, i.matched.join(' ')].join(' ').toLowerCase().includes(q)));
  rows.sort($('sort').value === 'new'
    ? (a, b) => b.seen.localeCompare(a.seen) || b.id - a.id
    : (a, b) => (a.deadline || '9999').localeCompare(b.deadline || '9999') || a.tier.localeCompare(b.tier));
  $('count').textContent = `${rows.length} of ${DATA.items.length} notices`;
  $('list').innerHTML = rows.length ? rows.slice(0, 400).map(card).join('') : '<div class="empty">Nothing matches these filters.</div>';
  try { localStorage.setItem('jr-filters', JSON.stringify({tiers: [...state.tiers], area, kind, within, status, sort: $('sort').value, open: $('open').checked})); } catch (e) {}
}
render();
</script>
